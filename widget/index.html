<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abacus Digital Chatbot — Test Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap');

        :root {
            --blue: #0099FF;
            --blue-deep: #0684C7;
            --ink: #171717;
            --muted: #5A6472;
            --line: #E3EBF3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ---- Slim testing toolbar ---- */

        #test-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 16px;
            height: 48px;
            padding: 0 16px;
            background: #FFFFFF;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
            color: var(--muted);
        }

        #test-bar .brand {
            font-weight: 500;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        #test-bar .spacer { flex: 1; }

        #test-bar a, #test-bar button {
            font: inherit;
            color: var(--blue-deep);
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background 0.15s ease;
        }

        #test-bar a:hover, #test-bar button:hover {
            background: rgba(0, 153, 255, 0.08);
        }

        /* ---- Full-page chat ----
           The embeddable widget normally floats as a small window anchored to a
           corner; these overrides stretch it to fill the rest of the viewport for
           easier manual testing. The Framer embed itself is untouched — this only
           affects this local test page. */

        #chat-area {
            flex: 1;
            position: relative;
            min-height: 0;
            background: #FAFBFC;
        }

        #abacus-chat-widget {
            position: static !important;
        }

        .abacus-trigger {
            display: none !important;
        }

        .abacus-chat-window {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            max-height: 100% !important;
            max-width: 100% !important;
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
            transform: none !important;
        }
    </style>
</head>
<body>
    <div id="test-bar">
        <span class="brand">Abacus Digital</span>
        <span>chat test page</span>
        <div class="spacer"></div>
        <button id="reset-session" type="button" title="Clear the local visitor/session data and start over">New session</button>
        <a href="./client.html">Test client mode →</a>
    </div>

    <div id="chat-area"></div>

    <script>
        document.getElementById('reset-session').addEventListener('click', () => {
            Object.keys(localStorage)
                .filter((key) => key.startsWith('abacus_'))
                .forEach((key) => localStorage.removeItem(key));
            location.reload();
        });
    </script>

    <script src="./abacus-chat-widget.js?v=2026-08-13.2" data-mode="public"></script>
    <script>
        // The widget mounts itself into <body> as a fixed-position floating bubble;
        // move it into the full-page chat area and open it immediately so there's no
        // click needed before every test. The widget's own bootstrap defers to
        // DOMContentLoaded when the page is still parsing (which it is, this far up
        // the body) — mirror that same check so this always runs after the widget's
        // DOM actually exists, not before.
        function mountFullPage() {
            const widget = document.getElementById('abacus-chat-widget');
            const chatArea = document.getElementById('chat-area');
            if (widget && chatArea) chatArea.appendChild(widget);

            const trigger = document.getElementById('abacus-trigger');
            if (trigger) trigger.click();
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', mountFullPage);
        } else {
            mountFullPage();
        }
    </script>
</body>
</html>
