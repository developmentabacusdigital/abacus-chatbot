[pytest]
testpaths = tests
asyncio_mode = auto
; asyncpg pools/connections are bound to the loop they were created on. The Postgres
; test fixture is session-scoped (starting embedded Postgres per-test would be far too
; slow), so every async fixture needs to share that same one loop for the whole run —
; otherwise Windows' ProactorEventLoop throws "attached to a different loop" the moment
; a later test's function-scoped loop touches a pool created on an earlier one.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
pythonpath = . tests
filterwarnings =
    ignore::DeprecationWarning
